name: CI
on:
  push:
    branches:
      - main
      - e35
  pull_request:
    branches:
      - '**'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.23'
          cache: false

      - run: go test ./...

      - run: go install github.com/pelletier/go-toml/v2/cmd/tomll@latest

      - run: tomll arb-sepolia.toml
      - run: tomll arb1.toml
      - run: tomll bloatnet.toml
      - run: tomll chiado.toml
      - run: tomll gnosis.toml
      - run: tomll mainnet.toml
      - run: tomll sepolia.toml
      - run: tomll hoodi.toml

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # same level as the lint in erigontech/scripts
      - name: ShellCheck
        run: |
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck --severity=warning
