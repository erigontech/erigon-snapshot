name: Mirror
run-name: Mirror after merging PR${{ github.event.pull_request.number }} ${{ github.event.pull_request.html_url }}


concurrency:
  group: mirror-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false


env:
  # proactively set for future use
  GREEN: '\033[0;32m'
  RED: '\033[0;31m'
  YELLOW: '\033[0;33m'
  NOCOLOUR: '\033[0m'
  TEMPLATE_BRANCH: "main"


on:
  pull_request:
    types: [closed]      

jobs:
  mirror:
    if: github.event.pull_request.merged == true 
    runs-on: ubuntu-latest
    permissions:
      contents: read


    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        # ref: ${{ github.event.pull_request.base.ref }} #commented as a subtle problem might sometimes arise in case of n on-merge PRs/unit of time


    - name: Download needed bits
      env:
        # same pinned version as mirror-check.yml
        RCLONE_VERSION: v1.76.0
        RCLONE_SHA256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
        MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
      run: |
        set +x
        zip="rclone-$RCLONE_VERSION-linux-amd64.zip"
        curl -fsSLO "https://downloads.rclone.org/$RCLONE_VERSION/$zip"
        echo "$RCLONE_SHA256  $zip" | sha256sum -c -
        mkdir -p "$HOME/bin"
        unzip -q -j "$zip" "rclone-$RCLONE_VERSION-linux-amd64/rclone" -d "$HOME/bin"
        echo "$HOME/bin" >> "$GITHUB_PATH"
        curl -fsSL -H "Authorization: Bearer $MIRROR_PAT" -H "Accept: application/vnd.github.v3.raw" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/erigontech/scripts/contents/erigon-snapshot/mirror.sh?ref=$TEMPLATE_BRANCH" -o /tmp/mirror
        chmod +x /tmp/mirror
        
        
    - name: Mirror '${{ github.event.pull_request.base.ref }}' to CDN <<<<-#--#--#--#--#- !!!
      id: mirror_execution
      env:
        MIRROR_CONF: ${{ secrets.MIRROR_CONF }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        set +x
        printf '%s' "$MIRROR_CONF" | base64 -d > /tmp/mirror.conf
        if /tmp/mirror "$GITHUB_WORKSPACE" "$BASE_REF" /tmp/mirror.conf > /tmp/mirror_output.txt 2>&1; then
          echo -e "${{ env.YELLOW }} ----------------------------------------------------------------------------------------------------------------- ${{ env.NOCOLOUR }}"
          echo -e "${{ env.YELLOW }} Files related to '${{ github.event.pull_request.base.ref }}' target branch, after PR ${{ github.event.pull_request.number }} got merged to it, were successfully mirrored to CDN ${{ env.NOCOLOUR }}"
          echo -e "${{ env.YELLOW }} ----------------------------------------------------------------------------------------------------------------- ${{ env.NOCOLOUR }}"
          echo "rclone_failed=0" >> "$GITHUB_OUTPUT"
        else
          echo -e "${{ env.RED }} ----------------------------------------------------------------------------------------------------------------- ${{ env.NOCOLOUR }}"
          echo -e "${{ env.RED }} There was an error in the mirroring process, please check the logs ${{ env.NOCOLOUR }}"
          echo -e "${{ env.RED }} ----------------------------------------------------------------------------------------------------------------- ${{ env.NOCOLOUR }}"
          echo "rclone_failed=1" >> "$GITHUB_OUTPUT"
        fi
  
        
    - name: Output preparation
      env:
        ENC_PSW: ${{ secrets.ENC_PSW }}
      run: |
        if [ -f /tmp/mirror_output.txt ]; then
          # the password is read from the environment, not passed on the command line
          openssl aes-256-cbc -salt -pbkdf2 -iter 900000 -in /tmp/mirror_output.txt -out /tmp/mirror_output.enc -pass env:ENC_PSW
        else
          echo -e "${{ env.RED }} ----------------------------------------------------------------------------------------------------------------- ${{ env.NOCOLOUR }}"
          echo -e "${{ env.RED }} /tmp/mirror_output.txt does not exist, skipping encryption and exiting with 98. ${{ env.NOCOLOUR }}"
          echo -e "${{ env.RED }} ----------------------------------------------------------------------------------------------------------------- ${{ env.NOCOLOUR }}"
          exit 98
        fi


    - name: Upload main output as artifact
      uses: actions/upload-artifact@v7
      with:
        name: mirror_output.enc
        path: /tmp/mirror_output.enc


    - name: Set workflow failed status when step id "mirror_execution" failed.
      if: steps.mirror_execution.outputs.rclone_failed == 1
      run: exit 1


    - name: Notify about failure
      if: failure()
      env:
        WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      run: |
        if [ -z "$WEBHOOK_URL" ]; then
          echo "::warning::NOTIFICATION_WEBHOOK is not set, failure notification not sent"
          exit 0
        fi
        msg=$(printf 'Mirror of %s to CDN FAILED (after merging PR #%s %s)\nTime: %s\nRun: %s' \
          "$BASE_REF" "$PR_NUMBER" "$PR_URL" "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" "$RUN_URL")
        jq -n --arg content "$msg" '{content: $content}' \
          | curl -fsS --retry 3 --max-time 20 -H 'Content-Type: application/json' -d @- "$WEBHOOK_URL" >/dev/null \
          || echo "::warning::failure notification could not be sent"


    - name: Housekeeping
      if: always()
      run: |
        rm -f /tmp/mirror /tmp/mirror_output.txt /tmp/mirror_output.enc /tmp/mirror.conf  # It is always advisable to clean up after you have made someone else's house dirty

